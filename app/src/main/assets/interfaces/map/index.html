<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:100%; height:100%; overflow:hidden; background:transparent; }
.shell {
    position:relative; width:100%; height:100%;
    border-radius:12px; overflow:hidden;
    border:2px solid rgba(0,0,0,0.8);
}
.viewport { position:absolute; inset:0; overflow:hidden; background:#5a7a45; }
.tiles { position:absolute; width:3000px; height:3000px; }
.tiles img { position:absolute; width:300px; height:300px; image-rendering:pixelated; }
.dot {
    position:absolute; width:10px; height:10px;
    background:#fff; border:2px solid #000;
    border-radius:50%; transform:translate(-50%,-50%);
    z-index:10; left:50%; top:50%;
}
.vignette {
    position:absolute; inset:0; border-radius:10px;
    background:radial-gradient(circle, transparent 40%, rgba(0,0,0,0.5) 100%);
    pointer-events:none; z-index:5;
}
.gps {
    position:absolute; top:5px; left:5px; z-index:10;
    background:rgba(0,0,0,0.6); border-radius:999px;
    padding:2px 7px; font-size:8px; font-weight:700;
    color:#fff; font-family:Arial,sans-serif;
    display:flex; align-items:center; gap:3px;
}
.gps-dot { width:5px; height:5px; border-radius:50%; background:#4ade80; }
</style>
</head>
<body>
<div class="shell">
  <div class="viewport" id="vp">
    <div class="tiles" id="tiles"></div>
    <div class="dot"></div>
  </div>
  <div class="vignette"></div>
  <div class="gps"><span class="gps-dot"></span>GPS</div>
</div>
<script>
const WORLD_MIN_X=-3000, WORLD_MAX_Y=3000, WORLD_SIZE=6000;
const MAP_PX=3000, TILE_PX=300, COLS=10;
const tiles=document.getElementById('tiles');
const vp=document.getElementById('vp');

for(let i=0;i<100;i++){
    const img=document.createElement('img');
    img.src='tiles/radar'+i+'.png';
    img.style.left=(i%COLS)*TILE_PX+'px';
    img.style.top=Math.floor(i/COLS)*TILE_PX+'px';
    tiles.appendChild(img);
}

let px=0, py=0;
function updateMap(){
    const vw=vp.clientWidth, vh=vp.clientHeight;
    const mx=((px-WORLD_MIN_X)/WORLD_SIZE)*MAP_PX;
    const my=((WORLD_MAX_Y-py)/WORLD_SIZE)*MAP_PX;
    tiles.style.transform='translate('+(vw/2-mx)+'px,'+(vh/2-my)+'px)';
}

window.updatePlayerPos=function(x,y){
    px=x; py=y; updateMap();
};

updateMap();
window.addEventListener('resize',updateMap);
</script>
</body>
</html>
